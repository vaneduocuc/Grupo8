<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - StockMaster</title>
</head>
<body style="font-family: Arial; display: flex; justify-content: center; margin-top: 10%;">
    <div style="background: #f4f4f4; padding: 30px; border-radius: 8px; width: 300px;">
        <h2 style="text-align: center;">StockMaster</h2>
        <input type="text" id="username" placeholder="Usuario" style="width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box;">
        <input type="password" id="password" placeholder="Contraseña" style="width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box;">
        <button onclick="login()" style="width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer;">Ingresar</button>
    </div>
    <script>
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            const response = await fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await response.json();
            if(data.success) {
                alert("Bienvenido " + data.role + ". Token JWT Generado.");
            } else {
                alert("Error: " + data.message);
            }
        }
    </script>
</body>
</html>
